services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: server-infra-caddy-porkbun:2
    restart: unless-stopped
    env_file:
      - ${MODULE_ENV_FILE:-./runtime.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - server-infra

volumes:
  caddy-data:
  caddy-config:

networks:
  server-infra:
    name: server-infra
    external: true
